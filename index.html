<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TNMINING - Administrative Terminal Boot</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #020009;
      --bg-secondary: #09041a;
      --bg-card: rgba(13, 6, 30, 0.65);
      --border-color: rgba(168, 85, 247, 0.18);
      --primary: #a855f7;
      --secondary: #06b6d4;
      --primary-glow: rgba(168, 85, 247, 0.35);
      --secondary-glow: rgba(6, 182, 212, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --radius-premium: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 50%, var(--primary-glow) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    /* Outer Loader Shield */
    .loader-container {
      width: 100%;
      max-width: 420px;
      background: rgba(13, 6, 30, 0.85);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-premium);
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 0 15px rgba(168, 85, 247, 0.05);
      text-align: center;
      position: relative;
    }

    .loader-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-premium);
      padding: 1.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Core Spinner Animation */
    .core-node-spinner {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(6, 182, 212, 0.3);
      border-radius: 50%;
      animation: rotate-clockwise 12s linear infinite;
    }

    .ring-inner {
      position: absolute;
      width: 80%;
      height: 80%;
      border: 2.5px solid transparent;
      border-top-color: var(--primary);
      border-bottom-color: var(--secondary);
      border-radius: 50%;
      animation: rotate-counter 2.5s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite;
    }

    .center-cube {
      font-size: 26px;
      color: #fff;
      animation: heartbeat 1.8s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes rotate-clockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotate-counter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 15px var(--secondary-glow); }
    }

    .brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(to right, #ffffff, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-status {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 25px;
    }

    /* Terminal Boot lines */
    .terminal-output {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--secondary);
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255,255,255,0.03);
      padding: 12px 16px;
      border-radius: 12px;
      height: 72px;
      overflow-y: hidden;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .terminal-line {
      display: flex;
      gap: 6px;
      opacity: 0;
      transform: translateY(5px);
      animation: line-slide 0.3s forwards ease;
    }

    @keyframes line-slide {
      to { opacity: 1; transform: translateY(0); }
    }

    .line-ok { color: var(--success); }

    /* Loading Progress Bar Row */
    .progress-bar-row {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- Dynamic Boot Shield Loader Container -->
  <div class="loader-container">
    <div class="core-node-spinner">
      <div class="ring-outer"></div>
      <div class="ring-inner"></div>
      <i class="fa-solid fa-cube center-cube"></i>
    </div>

    <h1 class="brand-name">TNMINING</h1>
    <p class="brand-status">System Console Bootloader</p>

    <!-- Simulated Commandline Boot Outputs -->
    <div class="terminal-output" id="terminalBox">
      <div class="terminal-line" id="line1"><span class="line-ok">[SYS]</span> Mounting database trees...</div>
    </div>

    <div class="progress-bar-row">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const terminalBox = document.getElementById('terminalBox');
    const progressFill = document.getElementById('progressFill');

    // List of dynamic Web3 system initialization lines
    const bootSequences = [
      { prefix: "OK", text: "Synced decentralised core metrics..." },
      { prefix: "OK", text: "Compiled hash multi-session nodes..." },
      { prefix: "OK", text: "Connected Realtime Database API..." },
      { prefix: "OK", text: "Bypassing Authentication protocols..." },
      { prefix: "OK", text: "Access Authenticated. Deploying Dashboard..." }
    ];

    let currentStep = 0;
    let progressPercentage = 0;

    window.addEventListener('DOMContentLoaded', () => {
      startDynamicTerminalBoot();
    });

    function startDynamicTerminalBoot() {
      // Step-by-step progress and terminal logging trigger
      const timer = setInterval(() => {
        progressPercentage += 4;
        progressFill.style.width = `${progressPercentage}%`;

        // At specific milestones, append dynamic console outputs
        if (progressPercentage === 20 || progressPercentage === 40 || progressPercentage === 60 || progressPercentage === 80 || progressPercentage === 96) {
          const stepData = bootSequences[currentStep];
          if (stepData) {
            const newLine = document.createElement('div');
            newLine.classList.add('terminal-line');
            newLine.innerHTML = `<span class="line-ok">[${stepData.prefix}]</span> ${stepData.text}`;
            
            terminalBox.appendChild(newLine);
            currentStep++;
            
            // Auto scroll console wrapper downward
            terminalBox.scrollTop = terminalBox.scrollHeight;
          }
        }

        if (progressPercentage >= 100) {
          clearInterval(timer);
          
          // Absolute zero-latency redirect directly into Dashboard!
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 300);
        }
      }, 90); // Renders boot in ~2.2 seconds total
    }
  </script>
</body>
</html>
