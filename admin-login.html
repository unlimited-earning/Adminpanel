<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TNMINING - Admin Terminal Security</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #020009;
      --bg-secondary: #09041a;
      --bg-card: rgba(13, 6, 30, 0.65);
      --border-color: rgba(168, 85, 247, 0.18);
      --border-focus: rgba(6, 182, 212, 0.5);
      --primary: #a855f7;
      --secondary: #06b6d4;
      --primary-glow: rgba(168, 85, 247, 0.35);
      --secondary-glow: rgba(6, 182, 212, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error: #ef4444;
      --success: #10b981;
      --radius-premium: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% -20%, var(--primary-glow) 0%, transparent 60%),
        radial-gradient(circle at 10% 100%, var(--secondary-glow) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .auth-container {
      width: 100%;
      max-width: 400px;
      background: radial-gradient(circle at 50% 0%, rgba(24, 12, 54, 0.4) 0%, rgba(9, 4, 25, 0.85) 100%);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-premium);
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 0 15px rgba(168, 85, 247, 0.05);
      text-align: center;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-premium);
      padding: 1.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      background: rgba(168, 85, 247, 0.08);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--primary);
      margin: 0 auto 16px;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
      animation: float-icon 4s infinite ease-in-out;
    }

    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px 13px 46px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.07);
    }

    .form-input:focus + i {
      color: var(--secondary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-exit {
      display: block;
      margin-top: 22px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .btn-exit:hover {
      color: var(--error);
    }

    /* Toasts Container */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: rgba(18, 10, 36, 0.95);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show { transform: translateX(0); }
    .toast.error { border-left: 4px solid var(--error); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error i { color: var(--error); }
    .toast.success i { color: var(--success); }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="header-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1 class="title">Terminal Security Entry</h1>
    <p class="subtitle">Enter administrative credentials below</p>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <div class="input-wrapper">
          <input type="tel" id="adminPhone" class="form-input" placeholder="01XXXXXXXXX" required autocomplete="tel">
          <i class="fa-solid fa-phone"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Terminal Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-key"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">Unlock Console</button>
    </form>

    <a href="home.html" class="btn-exit">Return to Public App</a>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const loginForm = document.getElementById('adminLoginForm');
    const phoneInput = document.getElementById('adminPhone');
    const passwordInput = document.getElementById('adminPassword');
    const toastContainer = document.getElementById('toastContainer');

    const ASSIGNED_PHONE = "01310504728";
    const ASSIGNED_PASS = "RAFSAN20";

    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.classList.add('toast', type);
      const icon = type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
      
      toastContainer.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 50);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const enteredPhone = phoneInput.value.trim();
      const enteredPass = passwordInput.value;

      if (enteredPhone === ASSIGNED_PHONE && enteredPass === ASSIGNED_PASS) {
        showToast("Authentication confirmed. Directing to Terminal...", "success");
        
        // Generate security token to unlock sub-pages
        const timestamp = Date.now();
        const securePayload = btoa(JSON.stringify({
          authenticated: true,
          expiry: timestamp + (2 * 60 * 60 * 1000) // 2 Hour Session Lifetime
        }));
        
        localStorage.setItem('tn_admin_session', securePayload);

        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1200);
      } else {
        showToast("Invalid Credentials. Access Denied.", "error");
      }
    });

    // Check if token exists on load, redirect to dashboard if session is valid
    window.addEventListener('DOMContentLoaded', () => {
      const storedSession = localStorage.getItem('tn_admin_session');
      if (storedSession) {
        try {
          const parsed = JSON.parse(atob(storedSession));
          if (parsed.authenticated && parsed.expiry > Date.now()) {
            window.location.href = 'admin-dashboard.html';
          }
        } catch(e) {}
      }
    });
  </script>
</body>
</html>
