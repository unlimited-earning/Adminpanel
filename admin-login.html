<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TNMINING - Admin Terminal Security</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #020009;
      --bg-secondary: #09041a;
      --bg-card: rgba(13, 6, 30, 0.65);
      --border-color: rgba(168, 85, 247, 0.18);
      --border-focus: rgba(6, 182, 212, 0.5);
      --primary: #a855f7;
      --secondary: #06b6d4;
      --primary-glow: rgba(168, 85, 247, 0.35);
      --secondary-glow: rgba(6, 182, 212, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error: #ef4444;
      --success: #10b981;
      --radius-premium: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% -20%, var(--primary-glow) 0%, transparent 60%),
        radial-gradient(circle at 10% 100%, var(--secondary-glow) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Screen Loader Panel */
    .screen-loader {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }
    .screen-loader.fade-out { opacity: 0; pointer-events: none; }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(168, 85, 247, 0.1);
      border-top-color: var(--primary);
      border-right-color: var(--secondary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Security Terminal Box visual layout */
    .auth-container {
      width: 100%;
      max-width: 420px;
      background: radial-gradient(circle at 50% 0%, rgba(24, 12, 54, 0.4) 0%, rgba(9, 4, 25, 0.85) 100%);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-premium);
      padding: 40px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-premium);
      padding: 1.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .header-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin: 0 auto 20px;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
      animation: float-badge 4s infinite ease-in-out;
    }

    @keyframes float-badge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      padding: 13.5px 16px 13.5px 46px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      background: rgba(255, 255, 255, 0.07);
    }

    .form-input:focus + i {
      color: var(--secondary);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit .spinner-button {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-exit {
      display: block;
      margin-top: 22px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .btn-exit:hover {
      color: var(--error);
    }

    /* Toasts Container */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: rgba(18, 10, 36, 0.95);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show { transform: translateX(0); }
    .toast.error { border-left: 4px solid var(--error); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error i { color: var(--error); }
    .toast.success i { color: var(--success); }
  </style>
</head>
<body>

  <!-- Full Screen Gate Loader -->
  <div class="screen-loader" id="screenLoader">
    <div class="loader-spinner"></div>
  </div>

  <div class="auth-container">
    <div class="header-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h1 class="title">Administrative Gateway</h1>
    <p class="subtitle">Enter root credential parameters to unlock core control boards.</p>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label">Admin Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="adminEmail" class="form-input" placeholder="rafsanvai388@gmail.com" required autocomplete="email">
          <i class="fa-solid fa-envelope"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Security Password</label>
        <div class="input-wrapper">
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-key"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Unlock Console</span>
        <div class="spinner-button" id="btnSpinner"></div>
      </button>
    </form>

    <a href="home.html" class="btn-exit">Return to Public App</a>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Firebase Legacy Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDuQICVoC10i62PQMS6cX37t1eoeTg5zsc",
      authDomain: "mining-c7b26.firebaseapp.com",
      databaseURL: "https://mining-c7b26-default-rtdb.firebaseio.com",
      projectId: "mining-c7b26",
      storageBucket: "mining-c7b26.firebasestorage.app",
      messagingSenderId: "873757658723",
      appId: "1:873757658723:web:18a4af95953a08b440b256"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    // DOM Elements
    const screenLoader = document.getElementById('screenLoader');
    const loginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const toastContainer = document.getElementById('toastContainer');

    function showToast(message, type = 'error') {
      const toast = document.createElement('div');
      toast.classList.add('toast', type);
      const icon = type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
      
      toastContainer.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 50);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Checking Session on entry
    window.addEventListener('DOMContentLoaded', () => {
      auth.onAuthStateChanged((user) => {
        if (user) {
          db.ref(`Admins/${user.uid}`).once('value')
            .then((snapshot) => {
              if (snapshot.exists()) {
                const adminData = snapshot.val();
                if (adminData.role === 'admin' && adminData.status === 'active') {
                  window.location.href = 'admin-dashboard.html';
                  return;
                }
              }
              auth.signOut();
              screenLoader.classList.add('fade-out');
            })
            .catch(() => {
              auth.signOut();
              screenLoader.classList.add('fade-out');
            });
        } else {
          screenLoader.classList.add('fade-out');
        }
      });
    });

    // Submitting Creds
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      btnSpinner.style.display = 'block';
      btnText.style.opacity = '0.3';

      // Standard sign in attempts
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          verifyAndSeedAdminNode(user);
        })
        .catch((error) => {
          // SELF-HEALING ACTION (Rule 6 Programmatic creation)
          if (email === "rafsanvai388@gmail.com" && password === "RAFSAN20" && (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential')) {
            showToast("Self-Healing Triggered: Deploying Admin Credential Modules...", "success");
            
            // Programmatically deploy/re-deploy account inside Firebase Auth
            auth.createUserWithEmailAndPassword(email, password)
              .then((userCredential) => {
                const user = userCredential.user;
                verifyAndSeedAdminNode(user);
              })
              .catch((createError) => {
                showToast("Self-healing failed: " + createError.message, "error");
                resetBtnState();
              });
          } else {
            let msg = "Incorrect password or account parameter settings.";
            if (error.code === 'auth/invalid-email') msg = "Invalid email formatting.";
            showToast(msg, "error");
            resetBtnState();
          }
        });
    });

    // Auto seed permission tables securely
    function verifyAndSeedAdminNode(user) {
      db.ref(`Admins/${user.uid}`).once('value')
        .then((snapshot) => {
          if (!snapshot.exists()) {
            // Write direct active configurations to Firebase database
            const adminSetupObj = {
              name: "Admin Rafsan",
              email: "rafsanvai388@gmail.com",
              role: "admin",
              status: "active",
              permissions: {
                users: true,
                mining: true,
                withdraw: true,
                task: true,
                referral: true,
                buyPower: true,
                announcement: true,
                settings: true
              }
            };

            db.ref(`Admins/${user.uid}`).set(adminSetupObj)
              .then(() => {
                completeRedirectAction(user);
              })
              .catch(() => {
                showToast("Write permission missing. Please verify DB rules.", "error");
                resetBtnState();
              });
          } else {
            const adminData = snapshot.val();
            if (adminData.role === 'admin' && adminData.status === 'active') {
              completeRedirectAction(user);
            } else {
              showToast("Access Denied: Administrative Node Inactive.", "error");
              auth.signOut();
              resetBtnState();
            }
          }
        });
    }

    function completeRedirectAction(user) {
      showToast("Access Authenticated! Directing to terminal consoles...", "success");

      const tokenTime = Date.now();
      const payload = btoa(JSON.stringify({
        authenticated: true,
        role: "admin",
        expiry: tokenTime + (2 * 60 * 60 * 1000)
      }));
      localStorage.setItem('tn_admin_session', payload);

      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1200);
    }

    function resetBtnState() {
      submitBtn.disabled = false;
      btnSpinner.style.display = 'none';
      btnText.style.opacity = '1';
    }
  </script>
</body>
</html>
